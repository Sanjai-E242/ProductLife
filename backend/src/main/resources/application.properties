# Application Identity
spring.application.name=ProductLife

# Server Port (Preserving port 8081 to avoid conflict with local Apache on 8080)
server.port=8081

# Database Configuration
# Defaults to persistent embedded H2 (./data/productlife) with MySQL compatibility mode for seamless zero-setup execution.
# To connect to external MySQL, simply set DB_URL (e.g. jdbc:mysql://127.0.0.1:3306/productlife), DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/productlife;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Spring Data JPA & Hibernate
# 'update' creates or updates tables automatically without deleting existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8081/h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Levels for Development
logging.level.com.productlife=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Digital Product Passport Base URL (Encoded into QR codes)
productlife.passport.public-base-url=${PRODUCTLIFE_PUBLIC_BASE_URL:${PASSPORT_BASE_URL:http://localhost:5174/products}}
# Default base URL
productlife.passport.default-base-url=http://localhost:5174/products
# Verified host
productlife.passport.lan-host=${PRODUCTLIFE_LAN_HOST:localhost}

# Administrator Authentication Configuration
# Default credentials: username=admin, password=admin123 (can be overridden via environment variable)
productlife.admin.username=${ADMIN_USERNAME:admin}
productlife.admin.password=${ADMIN_PASSWORD:admin123}

