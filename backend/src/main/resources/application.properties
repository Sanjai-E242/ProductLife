# Application Identity
spring.application.name=ProductLife

# Server Port (Preserving port 8081 to avoid conflict with local Apache on 8080)
server.port=8081

# MySQL Database Configuration
# Uses environment variables with secure defaults so passwords are never hardcoded in git
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/productlife?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:productlife_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA & Hibernate
# 'update' creates or updates tables automatically without deleting existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Levels for Development
logging.level.com.productlife=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Digital Product Passport Base URL (Encoded into QR codes)
# Uses the inspected Wi-Fi IPv4 address (192.168.1.6) and port 5174, while allowing override via environment
productlife.passport.public-base-url=${PRODUCTLIFE_PUBLIC_BASE_URL:${PASSPORT_BASE_URL:http://192.168.1.6:5174/products}}
# Default base URL pointing to the verified Wi-Fi LAN address
productlife.passport.default-base-url=http://192.168.1.6:5174/products
# Verified laptop Wi-Fi host
productlife.passport.lan-host=${PRODUCTLIFE_LAN_HOST:192.168.1.6}

# Administrator Authentication Configuration
# Loaded strictly from environment variables. If ADMIN_PASSWORD is not set, login fails safely.
productlife.admin.username=${ADMIN_USERNAME:admin}
productlife.admin.password=${ADMIN_PASSWORD:}

